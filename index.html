<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>โบอิ้งมาแล้วววว</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --sky-top: #1a0b2e;
        --sky-mid: #4a1d6a;
        --sky-bottom: #d46b78;
        --sunset: #f4a261;
        --chonburi: #4cc9f0;
        --samui: #f72585;
        --line: #ffd6ff;
        --text: #fff5f7;
        --button: #ff4d6d;
        --button-shadow: #ff4d6d55;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
        overflow: hidden;
      }

      body {
        font-family:
          "Sarabun",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: linear-gradient(
          180deg,
          var(--sky-top) 0%,
          var(--sky-mid) 45%,
          var(--sky-bottom) 85%,
          var(--sunset) 100%
        );
        color: var(--text);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        min-height: 100vh;
        position: relative;
      }

      /* Stars */
      .stars {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
      }
      .star {
        position: absolute;
        width: 2px;
        height: 2px;
        background: white;
        border-radius: 50%;
        opacity: 0.6;
        animation: twinkle 3s ease-in-out infinite;
      }
      @keyframes twinkle {
        0%,
        100% {
          opacity: 0.3;
          transform: scale(1);
        }
        50% {
          opacity: 1;
          transform: scale(1.4);
        }
      }

      /* Main container */
      .container {
        z-index: 1;
        width: 100%;
        max-width: 420px;
        padding: 24px 16px 32px;
        display: flex;
        flex-direction: column;
        align-items: center;
        flex: 1;
      }

      .title {
        text-align: center;
        margin-bottom: 8px;
      }

      .title h1 {
        font-size: clamp(1.5rem, 6vw, 2rem);
        font-weight: 700;
        letter-spacing: 0.02em;
        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.25);
      }

      .subtitle {
        font-size: clamp(0.95rem, 4vw, 1.1rem);
        opacity: 0.9;
        margin-top: 4px;
      }

      /* Map card */
      .map-card {
        width: 100%;
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 28px;
        padding: 16px 12px 12px;
        margin-top: 16px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.25);
        position: relative;
      }

      .map-wrap {
        position: relative;
        width: 100%;
        aspect-ratio: 320 / 520;
      }

      .map-wrap svg {
        width: 100%;
        height: 100%;
        display: block;
      }

      .thailand {
        fill: rgba(255, 255, 255, 0.12);
        stroke: rgba(255, 255, 255, 0.55);
        stroke-width: 1.5;
        filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.15));
      }

      .connection-line {
        fill: none;
        stroke: var(--line);
        stroke-width: 2;
        stroke-dasharray: 6 4;
        opacity: 0.8;
        animation: flowLine 2s linear infinite;
      }

      @keyframes flowLine {
        0% {
          stroke-dashoffset: 20;
        }
        100% {
          stroke-dashoffset: 0;
        }
      }

      .point {
        cursor: pointer;
      }

      .point-core {
        fill: #fff;
      }

      .point-ring {
        fill: none;
        stroke-width: 2.5;
        opacity: 0.9;
      }

      .point-chonburi .point-ring {
        stroke: var(--chonburi);
      }
      .point-samui .point-ring {
        stroke: var(--samui);
      }

      .pulse {
        animation: pulseRing 2s ease-out infinite;
        transform-origin: center;
      }

      @keyframes pulseRing {
        0% {
          r: 6;
          opacity: 0.8;
        }
        100% {
          r: 18;
          opacity: 0;
        }
      }

      .label {
        font-size: 12px;
        font-weight: 600;
        fill: rgba(255, 255, 255, 0.95);
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
        pointer-events: none;
      }

      .label-sub {
        font-size: 10px;
        fill: rgba(255, 255, 255, 0.7);
        pointer-events: none;
      }

      .distance-badge {
        position: absolute;
        top: 8px;
        right: 10px;
        background: rgba(0, 0, 0, 0.25);
        padding: 4px 10px;
        border-radius: 20px;
        font-size: 11px;
        color: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(4px);
      }

      /* Heart animation layer */
      .heart-layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: visible;
      }

      .envelope-pin {
        position: absolute;
        width: 58px;
        height: 42px;
        transform: translate(-50%, -50%);
        border: 1px solid rgba(255, 176, 202, 0.95);
        border-radius: 12px;
        background:
          linear-gradient(
            135deg,
            rgba(255, 255, 255, 0.96),
            rgba(255, 235, 244, 0.95)
          ),
          repeating-linear-gradient(
            -45deg,
            rgba(255, 126, 163, 0.2) 0 6px,
            rgba(122, 224, 255, 0.22) 6px 12px
          );
        background-blend-mode: normal, multiply;
        box-shadow:
          0 14px 26px rgba(0, 0, 0, 0.28),
          0 0 0 4px rgba(255, 255, 255, 0.1);
        cursor: pointer;
        pointer-events: auto;
        animation:
          envelopePop 0.35s ease-out,
          envelopeFloat 1.8s ease-in-out infinite;
        z-index: 5;
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease;
      }

      .envelope-pin::before,
      .envelope-pin::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        margin: auto;
        pointer-events: none;
      }

      .envelope-pin::before {
        top: 11px;
        width: 0;
        height: 0;
        border-left: 28px solid transparent;
        border-right: 28px solid transparent;
        border-top: 18px solid #ffc9dd;
        opacity: 0.95;
        filter: drop-shadow(0 1px 0 rgba(255, 255, 255, 0.55));
      }

      .envelope-pin::after {
        content: "\2764";
        top: 17px;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #ff9fc0, #ff5f93);
        color: #fff;
        font-size: 12px;
        line-height: 22px;
        text-align: center;
        font-weight: 700;
        box-shadow:
          0 3px 8px rgba(255, 64, 124, 0.45),
          inset 0 1px 0 rgba(255, 255, 255, 0.5);
        opacity: 1;
        transform: none;
      }

      .envelope-pin:active {
        transform: translate(-50%, -50%) scale(0.96);
      }

      .envelope-pin:hover {
        transform: translate(-50%, -50%) translateY(-1px) scale(1.03);
        box-shadow:
          0 18px 28px rgba(0, 0, 0, 0.3),
          0 0 0 4px rgba(255, 255, 255, 0.14);
      }

      @keyframes envelopePop {
        0% {
          opacity: 0;
          transform: translate(-50%, -50%) scale(0.4);
        }
        100% {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1);
        }
      }

      @keyframes envelopeFloat {
        0%,
        100% {
          margin-top: 0;
        }
        50% {
          margin-top: -5px;
        }
      }

      .flying-heart {
        position: absolute;
        font-size: 24px;
        line-height: 1;
        offset-path: path("M 141.5 272.1 Q 180 340 115 410.3");
        offset-rotate: 0deg;
        animation: flyHeart 2.2s ease-in-out forwards;
        filter: drop-shadow(0 2px 6px rgba(255, 0, 100, 0.4));
      }

      @keyframes flyHeart {
        0% {
          offset-distance: 0%;
          opacity: 0;
          transform: scale(0.4);
        }
        10% {
          opacity: 1;
        }
        50% {
          transform: scale(1.1);
        }
        100% {
          offset-distance: 100%;
          opacity: 1;
          transform: scale(1);
        }
      }

      .burst-heart {
        position: absolute;
        font-size: 18px;
        animation: burst 1.2s ease-out forwards;
      }

      @keyframes burst {
        0% {
          transform: translate(0, 0) scale(0.5);
          opacity: 1;
        }
        100% {
          transform: translate(var(--tx), var(--ty)) scale(1.6);
          opacity: 0;
        }
      }

      /* Controls */
      .controls {
        width: 100%;
        margin-top: 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .send-btn {
        width: 100%;
        padding: 18px 24px;
        font-size: 1.15rem;
        font-weight: 700;
        font-family: inherit;
        color: #fff;
        background: linear-gradient(135deg, var(--button) 0%, #ff758f 100%);
        border: none;
        border-radius: 50px;
        cursor: pointer;
        box-shadow: 0 8px 24px var(--button-shadow);
        transition:
          transform 0.15s ease,
          box-shadow 0.15s ease;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
      }

      .send-btn:active {
        transform: scale(0.96);
        box-shadow: 0 4px 14px var(--button-shadow);
      }

      .send-btn:disabled {
        opacity: 0.75;
        cursor: wait;
      }

      .counter {
        text-align: center;
        font-size: 0.85rem;
        opacity: 0.75;
        margin-top: 2px;
      }

      .footer {
        text-align: center;
        font-size: 0.8rem;
        opacity: 0.6;
        padding-bottom: 16px;
      }

      .letter-modal {
        position: fixed;
        inset: 0;
        background: rgba(15, 6, 24, 0.65);
        backdrop-filter: blur(4px);
        display: grid;
        place-items: center;
        z-index: 12;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease;
        padding: 16px;
      }

      .letter-modal.show {
        opacity: 1;
        pointer-events: auto;
      }

      .letter-card {
        position: relative;
        width: min(92vw, 380px);
        background: linear-gradient(180deg, #fff9fb 0%, #ffeef4 100%);
        color: #5f1f36;
        border-radius: 22px;
        padding: 18px 16px 14px;
        box-shadow: 0 20px 46px rgba(0, 0, 0, 0.35);
        transform: translateY(10px) scale(0.98);
        transition: transform 0.25s ease;
      }

      .letter-modal.show .letter-card {
        transform: translateY(0) scale(1);
      }

      .letter-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 8px;
      }

      .letter-title {
        font-size: 1.1rem;
        font-weight: 700;
      }

      .letter-close {
        border: none;
        background: #ffbfd1;
        color: #7a2848;
        width: 30px;
        height: 30px;
        border-radius: 999px;
        font-size: 18px;
        line-height: 1;
        cursor: pointer;
      }

      .letter-body {
        font-size: 0.98rem;
        line-height: 1.7;
        white-space: pre-line;
        padding: 6px 2px 2px;
      }

      .love-stamp {
        position: absolute;
        right: 16px;
        bottom: 12px;
        width: 86px;
        height: 86px;
        border: 3px solid rgba(211, 55, 107, 0.72);
        border-radius: 50%;
        color: rgba(180, 29, 80, 0.88);
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.08em;
        display: grid;
        place-items: center;
        transform: rotate(-14deg) scale(1.55);
        opacity: 0;
        background: radial-gradient(
          circle at 30% 30%,
          rgba(255, 182, 210, 0.24),
          rgba(255, 255, 255, 0)
        );
        text-shadow: 0 1px 0 rgba(255, 255, 255, 0.6);
        box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.45);
        pointer-events: none;
      }

      .love-stamp::before,
      .love-stamp::after {
        content: "";
        position: absolute;
        inset: 7px;
        border: 1.6px dashed rgba(211, 55, 107, 0.45);
        border-radius: 50%;
      }

      .love-stamp::after {
        inset: 15px;
        border-style: solid;
        border-color: rgba(211, 55, 107, 0.28);
      }

      .love-stamp.show-stamp {
        animation: stampDrop 0.56s cubic-bezier(0.2, 0.9, 0.2, 1) forwards;
      }

      .letter-body.is-typing::after {
        content: "";
        display: inline-block;
        width: 2px;
        height: 1em;
        margin-left: 3px;
        vertical-align: -2px;
        background: #d64b7e;
        animation: caretBlink 0.8s steps(1, end) infinite;
      }

      .type-char {
        display: inline-block;
        animation: charPop 0.24s ease-out;
      }

      @keyframes charPop {
        0% {
          opacity: 0;
          transform: translateY(6px) scale(0.75);
        }
        70% {
          opacity: 1;
          transform: translateY(-1px) scale(1.05);
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes caretBlink {
        0%,
        49% {
          opacity: 1;
        }
        50%,
        100% {
          opacity: 0;
        }
      }

      @keyframes stampDrop {
        0% {
          opacity: 0;
          transform: rotate(-14deg) translateY(-28px) scale(1.55);
        }
        62% {
          opacity: 1;
          transform: rotate(-14deg) translateY(4px) scale(0.96);
        }
        80% {
          transform: rotate(-14deg) translateY(-1px) scale(1.04);
        }
        100% {
          opacity: 0.95;
          transform: rotate(-14deg) translateY(0) scale(1);
        }
      }

      /* Floating mini hearts ambient */
      .ambient-heart {
        position: fixed;
        font-size: 14px;
        opacity: 0.35;
        animation: ambientFloat 8s ease-in-out infinite;
        pointer-events: none;
        z-index: 0;
      }

      @keyframes ambientFloat {
        0%,
        100% {
          transform: translateY(0) translateX(0);
          opacity: 0.2;
        }
        50% {
          transform: translateY(-30px) translateX(10px);
          opacity: 0.5;
        }
      }

      /* Responsive tweaks */
      @media (max-height: 700px) {
        .container {
          padding-top: 14px;
        }
        .map-card {
          margin-top: 10px;
        }
      }
    </style>
  </head>

        const LOVE_LETTER_TEXT = "โบอิ้งรักลาวีนที่สุดในสามโลกกกกกกกกกกก";
        let count = 0;
        let audioCtx = null;
        let envelopeEl = null;
        let typingTimerId = null;
        let voiceUrl = null;

        // Star field
        for (let i = 0; i < 60; i++) {
          const s = document.createElement("div");
          s.className = "star";
          s.style.left = Math.random() * 100 + "%";
          s.style.top = Math.random() * 100 + "%";
          s.style.animationDelay = Math.random() * 3 + "s";
          s.style.transform = `scale(${0.5 + Math.random()})`;
          stars.appendChild(s);
        }

        // Ambient hearts
        for (let i = 0; i < 6; i++) {
          const h = document.createElement("div");
          h.className = "ambient-heart";
          h.textContent = ["💕", "💖", "💗", "💓", "💞", "💘"][i];
          h.style.left = 10 + Math.random() * 80 + "%";
          h.style.top = 10 + Math.random() * 80 + "%";
          h.style.animationDelay = Math.random() * 5 + "s";
          h.style.fontSize = 12 + Math.random() * 14 + "px";
          document.body.appendChild(h);
        }

        function playChime() {
          if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          }
          if (audioCtx.state === "suspended") audioCtx.resume();
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(
            1046.5,
            audioCtx.currentTime + 0.15,
          );
          gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(
            0.001,
            audioCtx.currentTime + 0.5,
          );
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.5);
        }

        function burstAt(x, y) {
          for (let i = 0; i < 8; i++) {
            const h = document.createElement("div");
            h.className = "burst-heart";
            h.textContent = ["💕", "💖", "💗", "💓"][
              Math.floor(Math.random() * 4)
            ];
            const angle = (Math.PI * 2 * i) / 8;
            const dist = 40 + Math.random() * 30;
            h.style.setProperty("--tx", Math.cos(angle) * dist + "px");
            h.style.setProperty("--ty", Math.sin(angle) * dist + "px");
            h.style.left = x + "px";
            h.style.top = y + "px";
            heartLayer.appendChild(h);
            setTimeout(() => h.remove(), 1200);
          }
        }

        function vibrateArrival() {
          if (typeof navigator === "undefined") return;
          if (typeof navigator.vibrate !== "function") return;
          navigator.vibrate(18);
        }

        function openLetter() {
          letterModal.classList.add("show");
          letterModal.setAttribute("aria-hidden", "false");
          startLetterTyping(LOVE_LETTER_TEXT);

          if (voicePlayer && voicePlayer.src) {
            voicePlayer.currentTime = 0;
            const playAttempt = voicePlayer.play();
            if (playAttempt && typeof playAttempt.catch === "function") {
              playAttempt.catch(() => {});
            }
          }
        }

        function closeLetterModal() {
          letterModal.classList.remove("show");
          letterModal.setAttribute("aria-hidden", "true");
          if (typingTimerId) {
            clearTimeout(typingTimerId);
            typingTimerId = null;
          }
          voicePlayer.pause();
          letterBody.classList.remove("is-typing");
        }

        function initEmbeddedVoice() {
          if (!EMBEDDED_VOICE_DATA_URL) return;
          if (voiceUrl) {
            URL.revokeObjectURL(voiceUrl);
            voiceUrl = null;
          }
          voicePlayer.src = EMBEDDED_VOICE_DATA_URL;
        }

        function animateLoveStamp() {
          loveStamp.classList.remove("show-stamp");
          // Force reflow so animation can replay every time the letter is opened.
          void loveStamp.offsetWidth;
          loveStamp.classList.add("show-stamp");
        }

        function playStampSound() {
          if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          }
          if (audioCtx.state === "suspended") audioCtx.resume();

          const now = audioCtx.currentTime;

          const thumpOsc = audioCtx.createOscillator();
          const thumpGain = audioCtx.createGain();
          thumpOsc.type = "triangle";
          thumpOsc.frequency.setValueAtTime(170, now);
          thumpOsc.frequency.exponentialRampToValueAtTime(110, now + 0.08);
          thumpGain.gain.setValueAtTime(0.0001, now);
          thumpGain.gain.exponentialRampToValueAtTime(0.12, now + 0.015);
          thumpGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.11);
          thumpOsc.connect(thumpGain);
          thumpGain.connect(audioCtx.destination);
          thumpOsc.start(now);
          thumpOsc.stop(now + 0.12);

          const clickOsc = audioCtx.createOscillator();
          const clickGain = audioCtx.createGain();
          clickOsc.type = "square";
          clickOsc.frequency.setValueAtTime(860, now + 0.015);
          clickOsc.frequency.exponentialRampToValueAtTime(580, now + 0.06);
          clickGain.gain.setValueAtTime(0.0001, now + 0.015);
          clickGain.gain.exponentialRampToValueAtTime(0.035, now + 0.025);
          clickGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.075);
          clickOsc.connect(clickGain);
          clickGain.connect(audioCtx.destination);
          clickOsc.start(now + 0.015);
          clickOsc.stop(now + 0.08);
        }

        function startLetterTyping(text) {
          if (typingTimerId) {
            clearTimeout(typingTimerId);
            typingTimerId = null;
          }

          letterBody.textContent = "";
          letterBody.classList.add("is-typing");

          const chars =
            typeof Intl !== "undefined" && Intl.Segmenter
              ? Array.from(
                  new Intl.Segmenter("th", { granularity: "grapheme" }).segment(
                    text,
                  ),
                  (part) => part.segment,
                )
              : Array.from(text);
          let index = 0;

          function typeNext() {
            if (index >= chars.length) {
              letterBody.classList.remove("is-typing");
              animateLoveStamp();
              playStampSound();
              typingTimerId = null;
              return;
            }

            const ch = chars[index];
            const span = document.createElement("span");
            span.className = "type-char";
            span.textContent = ch === " " ? "\u00A0" : ch;
            letterBody.appendChild(span);

            index++;
            typingTimerId = setTimeout(typeNext, 55);
          }

          typeNext();
        }

        function placeEnvelope() {
          if (!envelopeEl) {
            envelopeEl = document.createElement("button");
            envelopeEl.className = "envelope-pin";
            envelopeEl.type = "button";
            envelopeEl.setAttribute("aria-label", "เปิดซองจดหมาย");
            envelopeEl.title = "คลิกเพื่อเปิดซองจดหมาย";
            envelopeEl.addEventListener("click", openLetter);
            heartLayer.appendChild(envelopeEl);
          }

          envelopeEl.style.left = "50%";
          envelopeEl.style.top = "50%";
        }

        function sendHeart() {
          const rect = mapWrap.getBoundingClientRect();
          const scaleX = rect.width / 320;
          const scaleY = rect.height / 560;

          const startX = 232 * scaleX;
          const startY = 255 * scaleY;
          const endX = 218 * scaleX;
          const endY = 528 * scaleY;

          const h = document.createElement("div");
          h.className = "flying-heart";
          h.textContent = ["💖", "💕", "💗", "💓", "💞", "💘"][
            Math.floor(Math.random() * 6)
          ];
          h.style.left = "0";
          h.style.top = "0";
          h.style.fontSize = 18 + Math.random() * 10 + "px";
          heartLayer.appendChild(h);

          setTimeout(() => {
            burstAt(endX, endY);
            placeEnvelope();
            vibrateArrival();
            h.remove();
          }, 2100);

          count++;
          counter.textContent = `ส่งไปแล้ว ${count} ดวง`;

          playChime();
        }

        sendBtn.addEventListener("click", () => {
          // Send a quick burst
          sendHeart();
          if (count < 3) {
            setTimeout(sendHeart, 350);
            setTimeout(sendHeart, 700);
          }
        });

        // Tap on points also sends love
        mapWrap.addEventListener("click", (e) => {
          if (e.target.closest("svg")) sendHeart();
        });

        closeLetter.addEventListener("click", closeLetterModal);
        letterModal.addEventListener("click", (e) => {
          if (e.target === letterModal) closeLetterModal();
        });

        // Subtle parallax on device tilt
        if (window.DeviceOrientationEvent) {
          window.addEventListener(
            "deviceorientation",
            (e) => {
              const x = (e.gamma || 0) / 45;
              const y = (e.beta || 0) / 90;
              stars.style.transform = `translate(${x * -8}px, ${y * -8}px)`;
            },
            true,
          );
        }

        initEmbeddedVoice();
      })();
    </script>
  </body>
</html>
